<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="服务状态监控 - 实时查看服务运行状态、可用率与历史故障">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻</text></svg>">
<title>🐻 大熊探针</title>
<style>
:root{
  --bg:#0b0e14;--card:#151b26;--card2:#1a2230;--border:#263042;--text:#e8edf3;--muted:#8b95a7;
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);--red:#ef4444;--red-bg:rgba(239,68,68,.12);
  --yellow:#f59e0b;--blue:#3b82f6;--radius:14px;
}
/* 下拉菜单 */
.dropdown-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:100;min-width:168px;padding:6px;overflow:hidden}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;background:transparent;color:var(--text);font-size:13.5px;border-radius:8px;cursor:pointer;transition:background .12s}
.dd-item:hover{background:rgba(255,255,255,.07)}
.dd-item .dd-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.dd-item.dd-danger{color:var(--red)}
.dd-item.dd-danger:hover{background:var(--red-bg)}
.dd-divider{height:1px;background:var(--border);margin:5px 8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
/* 顶栏 */
.topbar{border-bottom:1px solid var(--border);background:rgba(11,14,20,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.topbar-inner{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo small{font-weight:400;color:var(--muted);font-size:12px}
.admin-link{color:var(--muted);font-size:13px;cursor:pointer;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:.2s}
.admin-link:hover{color:var(--text);border-color:var(--muted)}
/* 主体 */
main{max-width:960px;margin:0 auto;padding:28px 20px 80px}
/* 大状态横幅 */
.hero{border-radius:var(--radius);padding:32px;margin-bottom:24px;display:flex;align-items:center;gap:20px;border:1px solid;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none}
.hero.ok{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.05));border-color:rgba(34,197,94,.35)}
.hero.ok::before{background:radial-gradient(circle at 20% 50%,rgba(34,197,94,.12),transparent 60%)}
.hero.bad{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05));border-color:rgba(239,68,68,.35)}
.hero.bad::before{background:radial-gradient(circle at 20% 50%,rgba(239,68,68,.12),transparent 60%)}
.hero .icon{font-size:44px;line-height:1;position:relative;z-index:1}
.hero h2{font-size:22px;margin-bottom:6px;position:relative;z-index:1}
.hero p{color:var(--muted);font-size:14px;position:relative;z-index:1}
.hero .pulse{width:16px;height:16px;border-radius:50%;flex-shrink:0;position:relative;z-index:1}
.hero.ok .pulse{background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
.hero.bad .pulse{background:var(--red);box-shadow:0 0 0 0 rgba(239,68,68,.5);animation:pulse 1s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;transition:.2s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px);border-color:#35415a}
.stat .ico{font-size:22px;margin-bottom:6px}
.stat .num{font-size:26px;font-weight:700}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:4px}
.stat .num.green{color:var(--green)}.stat .num.red{color:var(--red)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
/* 监控卡片 */
.mon-card{background:linear-gradient(180deg,var(--card),rgba(21,27,38,.8));border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;transition:all .25s ease}
.mon-card:hover{border-color:#3d4b66;transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mon-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;cursor:pointer}
.mon-info{display:flex;align-items:center;gap:12px}
.mon-info .name{font-weight:600;font-size:16px}
.mon-info .meta{color:var(--muted);font-size:12px;margin-top:2px}
.mon-right{display:flex;align-items:center;gap:16px}
.uptime-pct{font-size:20px;font-weight:700}
.uptime-pct.good{color:var(--green)}.uptime-pct.warn{color:var(--yellow)}.uptime-pct.bad{color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.up{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.down{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot.unknown{background:var(--muted)}
.mon-detail{display:none;border-top:1px solid var(--border);padding:18px 20px;background:var(--card2)}
.mon-detail.open{display:block}
.uptime-bar{display:flex;gap:3px;margin:12px 0}
.uptime-bar span{flex:1;height:32px;border-radius:4px;background:var(--border);min-width:4px;position:relative;cursor:default}
.uptime-bar span.up{background:var(--green)}
.uptime-bar span.down{background:var(--red)}
.uptime-bar span:hover{transform:scaleY(1.15)}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.detail-grid .item{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.detail-grid .item .v{font-size:16px;font-weight:600}
.detail-grid .item .k{color:var(--muted);font-size:11px;margin-top:2px}
/* 故障 */
.incident{border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;margin-bottom:14px}
.incident .t{font-weight:600;margin-bottom:4px}
.incident .d{color:var(--muted);font-size:13px}
/* 历史 */
.history-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;align-items:center}
.history-item:last-child{border:none}
.history-item .when{color:var(--muted);font-size:12px;min-width:130px}
/* 按钮表单 */
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:500;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.danger{background:var(--red)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge.danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.4)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px;width:100%;margin:4px 0;transition:.2s}
input:focus,select:focus{outline:none;border-color:var(--blue)}
label{font-size:13px;color:var(--muted);display:block;margin-top:12px;font-weight:500}
.row{display:flex;gap:12px}.row>*{flex:1}
@media(max-width:640px){
  .row{flex-direction:column}
  .mon-head{flex-direction:column;align-items:flex-start;gap:12px}
  .mon-right{width:100%;justify-content:space-between}
  .hero{padding:20px;flex-direction:column;text-align:center;gap:12px}
  .hero .icon{font-size:36px}
  .detail-grid{grid-template-columns:repeat(2,1fr)}
  .topbar-inner{padding:10px 16px}
  .logo{font-size:16px}
  /* 后台表格移动端：允许横向滚动，避免挤压 */
  .card table{display:block;overflow-x:auto;white-space:nowrap}
}
h2{font-size:17px;margin-bottom:4px}
.section-title{font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:28px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 8px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.checkbox-row{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.checkbox-row label{display:flex;align-items:center;gap:8px;margin:0;color:var(--text);cursor:pointer;font-size:14px}
.checkbox-row input{width:16px;height:16px;accent-color:var(--blue)}
.refresh-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
/* 响应时间曲线 */
.sparkline{width:120px;height:36px;flex-shrink:0}
.sparkline polyline{fill:none;stroke:var(--blue);stroke-width:1.5}
.sparkline .area{fill:rgba(59,130,246,.15);stroke:none}
/* 维护横幅 */
.maint-banner{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.maint-banner .icon{font-size:24px}
.maint-banner .t{font-weight:600;margin-bottom:4px}
.maint-banner .d{color:var(--muted);font-size:13px}
/* 骨架屏 */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-hero{height:110px;margin-bottom:24px}
.skeleton-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.skeleton-stats div{height:90px}
.skeleton-card{height:76px;margin-bottom:14px}
@media(max-width:640px){.skeleton-stats{grid-template-columns:repeat(2,1fr)}}
/* 历史时间线 */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:10px 0}
.timeline-item::before{content:"";position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.timeline-item.recovered::before{background:var(--green)}
.timeline-item .when{color:var(--muted);font-size:12px}
.timeline-item .what{font-size:14px;margin-top:2px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;border-top:1px solid var(--border);margin-top:40px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo">🐻 <span>大熊探针</span> <small id="subtitle"></small></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-size:13px;color:var(--muted);cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:8px" onclick="toggleLang()" id="lang-btn">EN</span>
    <span class="admin-link" onclick="showAdmin()">⚙️ <span id="admin-link-txt">管理</span></span>
  </div>
</div></div>
<main id="app">
  <div class="skeleton skeleton-hero"></div>
  <div class="skeleton-stats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  <div id="skel-cards"></div>
</main>
<script>
// 骨架屏卡片数按上次监控数渲染，减少加载完布局跳动
try {
  const n = Math.min(Math.max(parseInt(localStorage.getItem("probe_mon_count") || "3", 10), 1), 20);
  document.getElementById("skel-cards").innerHTML = Array(n).fill('<div class="skeleton skeleton-card"></div>').join("");
} catch (e) {
  document.getElementById("skel-cards").innerHTML = '<div class="skeleton skeleton-card"></div>'.repeat(3);
}
</script>
<footer>
  <div style="max-width:960px;margin:0 auto;padding:0 20px">
    <div style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:600;margin-bottom:8px">📬 订阅状态通知</div>
      <div style="display:flex;gap:8px;max-width:400px;margin:0 auto">
        <input id="sub-email" type="email" placeholder="输入邮箱，故障时第一时间通知你" style="text-align:left">
        <button class="btn sm" onclick="doSubscribe()" style="white-space:nowrap">订阅</button>
      </div>
      <div id="sub-msg" style="font-size:12px;margin-top:6px;min-height:18px"></div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:16px">Probe · Powered by Cloudflare Workers · <span id="updatetime"></span></div>
  </div>
</footer>

const t = k => STR[lang][k];
// 简写：tt('key') 取字符串，tt('hasDown', n) 传参
function tt(k, ...a) { const v = STR[lang][k]; return typeof v === "function" ? v(...a) : v; }
function toggleLang() {
  setLang(lang === "zh" ? "en" : "zh");
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("probe_lang", l); } catch (e) {}

  if (adminTxt) adminTxt.textContent = tt("admin");

}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (adminToken) headers["X-Admin-Token"] = adminToken;
  const r = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && adminToken && currentView === "admin") {
    // token 失效/被顶掉：统一跳回登录页
    logout(); showLogin();
    throw new Error(lang === "zh" ? "登录已过期，请重新登录" : "Session expired, please login again");
  }
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showModal(html) {
  closeModal();
  const ov = document.createElement("div");
  ov.id = "modal-ov";
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px";
  ov.innerHTML = html;
  ov.addEventListener("click", e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() {
  const ov = document.getElementById("modal-ov");
  if (ov) ov.remove();
}
function ago(ts) {
  if (!ts) return tt("never");
  const s = Math.floor(Date.now() / 1000) - ts;
  if (s < 60) return s + tt("secAgo");
  if (s < 3600) return Math.floor(s / 60) + tt("minAgo");
  if (s < 86400) return Math.floor(s / 3600) + tt("hourAgo");
  return Math.floor(s / 86400) + tt("dayAgo");
}
function pctClass(p) { p = parseFloat(p); return p >= 99 ? "good" : p >= 95 ? "warn" : "bad"; }

// ---------- 状态页 ----------
// 用聚合接口的 recent_checks 直接渲染曲线图（无需额外请求）
function sparkSvg(m) {
  const checks = m.recent_checks || [];
  const data = checks.filter(c => c.status === "up").map(c => c.ms);
  if (data.length < 2) return `<svg class="sparkline" viewBox="0 0 120 36" preserveAspectRatio="none"><polyline points=""/></svg>`;
  const max = Math.max(...data, 1), min = Math.min(...data, 0);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * 120;
    const y = 34 - ((v - min) / range) * 30;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="sparkline" viewBox="0 0 120 36" preserveAspectRatio="none"><polygon class="area" points="0,36 ${pts} 120,36"/><polyline points="${pts}"/></svg>`;
}

async function loadStatus() {
  currentView = "status";
  try {
    // 聚合接口：一次返回监控列表（含7天统计+检测记录）、故障、维护、品牌
    const data = await api("/api/status");
    const monitors = data.monitors || [];
    const incidents = data.incidents || [];
    const maintenances = data.maintenances || [];
    const histData = { incidents: data.history || [] };
    // 品牌信息直接用聚合返回的
    if (data.branding) {
      const { title, subtitle } = data.branding;
      if (title) {
        document.title = "🐻 " + title;
        document.querySelector(".logo span").textContent = title;
      }
      if (subtitle) document.querySelector("#subtitle").dataset.brand = subtitle;
    }
    // 自定义后台入口：只有路径匹配时才显示管理按钮
    // 默认 /admin 时为了兼容，在根路径也显示；自定义后仅在自定义路径显示
    const adminPath = (data.admin_path || "/admin").replace(/\/$/, "") || "/";
    const curPath = location.pathname.replace(/\/$/, "") || "/";
    const adminLink = document.querySelector(".admin-link");
    if (adminLink) {
      const isDefault = adminPath === "/admin";
      const show = isDefault ? (curPath === "/" || curPath === "/admin") : (curPath === adminPath);
      adminLink.style.display = show ? "" : "none";
    }
    monitorsCache = monitors;
    try { localStorage.setItem("probe_mon_count", String(monitors.length)); } catch (e) {}
    const downList = monitors.filter(m => m.last_status === "down");
    const allUp = downList.length === 0;
    const netMonitors = monitors.filter(m => m.type !== "agent");
    // 只统计已检测过的监控（last_check_at > 0），从未检测的不计入平均
    const measured = netMonitors.filter(m => m.last_check_at > 0);
    const avgMs = measured.length ? Math.round(measured.reduce((a, m) => a + (m.last_ms || 0), 0) / measured.length) : null;

    let html = "";

    // 维护横幅
    const nowTs = Math.floor(Date.now() / 1000);
    for (const mt of maintenances) {
      const active = mt.start_at <= nowTs && mt.end_at > nowTs;
      const upcoming = mt.start_at > nowTs;
      if (active || upcoming) {
        const when = active ? tt("maintActive") : tt("maintUpcoming") + " " + new Date(mt.start_at * 1000).toLocaleString(lang === "zh" ? "zh-CN" : "en-US");
        const endStr = lang === "zh" ? "zh-CN" : "en-US";
        html += `<div class="maint-banner"><span class="icon">🛠️</span><div>
          <div class="t">${esc(mt.title)} <span style="font-size:12px;color:var(--yellow)">· ${when}</span></div>

          : `${sparkSvg(m)}<span class="uptime-pct">${m.uptime_7d || "–"}%</span>

        html += `<div class="mon-card">
          <div class="mon-head" onclick="toggleDetail(${m.id})">
            <div class="mon-info"><span class="dot ${dot}"></span>
              <div><div class="name">${esc(m.name)}</div><div class="meta">${metaLine}</div></div>
            </div>
            <div class="mon-right">${rightSide}</div>
          </div>
          <div class="mon-detail" id="d-${m.id}"></div>
        </div>`;
      }
    }

    // 历史故障时间线
    const history = histData.incidents || [];
    if (history.length) {
      html += `<div class="section-title">📜 ${tt("history")}</div><div class="card"><div class="timeline">`;
      for (const h of history) {
        const dur = h.ended_at - h.started_at;
        const durStr = dur < 3600 ? Math.floor(dur / 60) + tt("min") : (dur / 3600).toFixed(1) + tt("hour");
        html += `<div class="timeline-item recovered">
          <div class="when">${new Date(h.started_at * 1000).toLocaleString(loc2)} · ${tt("duration")}${durStr}</div>
          <div class="what">${esc(h.name)} ${tt("recovered")}</div>
        </div>`;
      }
      html += `</div></div>`;
    }

    $("#app").innerHTML = html;
    const brandSub = $("#subtitle").dataset.brand;
    $("#subtitle").textContent = (brandSub ? brandSub + " · " : "") + tt("monitorsN", monitors.length);
    $("#updatetime").textContent = tt("lastUpdate") + " " + new Date().toLocaleString(loc2);
    // 聚合接口已含曲线和可用率数据，无需额外请求
  } catch (e) {
    $("#app").innerHTML = `<div class="card"><div class="empty"><div class="big">⚠️</div>${tt("testFailMsg")}${esc(e.message)}</div></div>`;
  }
}

// 字节格式化
function fmtBytes(b) {
  if (!b || b <= 0) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), units.length - 1);
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
}

// 简易 SVG 折线（null 点用上一个值补平）
function sparkLine(data, color, maxV) {
  if (!data || data.length < 2) return "";
  let last = 0;
  const vals = data.map(v => { if (v === null || v === undefined) return last; last = v; return v; });
  const max = maxV || Math.max(...vals, 1);
  const W = 260, H = 44;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * W).toFixed(1)},${(H - 3 - (v / max) * (H - 8)).toFixed(1)}`).join(" ");
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

// 响应时间曲线图
async function loadSparkline(id) {
  try {
    const { checks } = await api(`/api/monitors/${id}/checks?limit=50`);
    const svg = $("#spark-" + id);
    if (!svg || !checks.length) return;
    const data = checks.filter(c => c.status === "up").map(c => c.ms);
    if (data.length < 2) return;
    const max = Math.max(...data, 1), min = Math.min(...data, 0);
    const range = max - min || 1;
    const pts = data.map((v, i) => {
      const x = (i / (data.length - 1)) * 120;
      const y = 34 - ((v - min) / range) * 30;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    svg.innerHTML = `<polygon class="area" points="0,36 ${pts} 120,36"/><polyline points="${pts}"/>`;
  } catch (e) {}
}

  try {
    const { uptime } = await api(`/api/monitors/${id}/stats?days=7`);
    const el = $("#pct-" + id);
    if (el) { el.textContent = uptime + "%"; el.className = "uptime-pct " + pctClass(uptime); }
  } catch (e) {}
}

async function doLogin() {
  const pw = $("#pw").value;
  if (!pw) { $("#err").textContent = lang === "zh" ? "请输入密码" : "Please enter password"; return; }
  const totpCode = $("#totp")?.value?.trim() || "";
  try {
    const body = { password: pw };
    if (totpCode) body.totp_code = totpCode;
    const { token } = await api("/api/admin/login", { method: "POST", body: JSON.stringify(body) });
    adminToken = token; localStorage.setItem("probe_admin", token); showDashboard();
  } catch (e) {
    // 如果后端要求 TOTP，显示动态码输入框
    if (e.message === "动态码错误" || $("#totp").style.display !== "none") {
      $("#totp").style.display = "";

async function saveMonitor(event, id) {
  const btn = event.target;
  const oldText = btn.textContent;
  btn.textContent = lang === "zh" ? "保存中…" : "Saving…";
  btn.disabled = true;
  try {
  const b = {
    name: $("#f-name").value.trim(), type: $("#f-type").value, target: $("#f-target").value.trim(),
    group_name: $("#f-group").value.trim(),
    interval_minutes: parseInt($("#f-interval").value, 10),
    // 非 HTTP 类型时关键词和状态码用默认值
    keyword: $("#f-type").value === "http" ? $("#f-keyword").value.trim() : "",
    expected_status: $("#f-type").value === "http" ? (parseInt($("#f-status").value, 10) || 200) : 200,
    enabled: $("#f-en").checked ? 1 : 0,
    alert_telegram: $("#f-tg").checked, alert_email: $("#f-em").checked, alert_webhook: $("#f-wh").checked,
    webhook_url: $("#f-whurl").value.trim(),
    alert_dingtalk: $("#f-ding").checked, alert_bark: $("#f-bark").checked, alert_wecom: $("#f-wecom").checked, alert_custom_email: $("#f-cem").checked,
    alert_smtp: $("#f-smtp").checked, alert_serverchan: $("#f-sc").checked, alert_wxpusher: $("#f-wxp").checked, alert_feishu: $("#f-fs").checked,
    expire_at: $("#f-expire").value ? Math.floor(new Date($("#f-expire").value + "T00:00:00").getTime() / 1000) : 0,
    price_text: $("#f-price") ? $("#f-price").value.trim() : "",
    // 非 agent 类型时输入框不存在，沿用原值而非清零
    ssh_threshold: $("#f-ssh") ? (parseInt($("#f-ssh").value, 10) || 0) : (window._editingMonitor?.ssh_threshold || 0),
    cpu_threshold: $("#f-cpu") ? (parseInt($("#f-cpu").value, 10) || 0) : (window._editingMonitor?.cpu_threshold || 0),
    mem_threshold: $("#f-mem") ? (parseInt($("#f-mem").value, 10) || 0) : (window._editingMonitor?.mem_threshold || 0),
    disk_threshold: $("#f-disk") ? (parseInt($("#f-disk").value, 10) || 0) : (window._editingMonitor?.disk_threshold || 0),
    conn_threshold: $("#f-conn") ? (parseInt($("#f-conn").value, 10) || 0) : (window._editingMonitor?.conn_threshold || 0),
    process_watch: $("#f-procs") ? ($("#f-procs").value.trim() || "") : (window._editingMonitor?.process_watch || ""),
    ssl_domains: $("#f-ssldom") ? ($("#f-ssldom").value.trim() || "") : (window._editingMonitor?.ssl_domains || "")
  };
  if (!b.name) { alert(tt("nameRequired")); return; }
  if (b.type !== "agent" && !b.target) { alert(tt("targetRequired")); return; }
    let r;
    if (id) {
      await api(`/api/admin/monitors/${id}`, { method: "PUT", body: JSON.stringify(b) });
      showDashboard();
    } else {
      r = await api("/api/admin/monitors", { method: "POST", body: JSON.stringify(b) });
      await showDashboard();
      if (b.type === "agent" && r.agent_token) {
        setTimeout(() => showAgentGuide(r.id, r.agent_token, b.name), 300);
      }
    }
  } catch (e) { alert(tt("saveFail") + e.message); }
  finally { btn.textContent = oldText; btn.disabled = false; }
}

// 下拉菜单切换
function toggleDropdown(event, id) {
  event.stopPropagation();
  const menu = $("#dd-" + id);
  const isOpen = menu.style.display !== "none";
  // 先关掉所有
  document.querySelectorAll(".dropdown-menu").forEach(m => m.style.display = "none");
  if (!isOpen) {
    // 用 fixed 定位脱离 overflow 容器，避免被表格的横向滚动夹出滚动条
    const btn = event.currentTarget;
    const r = btn.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = (r.bottom + 6) + "px";
    menu.style.right = (window.innerWidth - r.right) + "px";
    menu.style.left = "auto";
    menu.style.display = "block";
  }
}
// 点其他地方关闭下拉菜单
document.addEventListener("click", () => {
  document.querySelectorAll(".dropdown-menu").forEach(m => m.style.display = "none");
});

    </div>
    <div style="margin-top:12px">
      <details style="font-size:13px;color:var(--muted)"><summary style="cursor:pointer">${tt("tokenManual")}</summary>

async function editMaintenance(id) {
  let mt = { title: "", description: "", start_at: 0, end_at: 0, status: "scheduled" };
  if (id) {
    const { maintenances } = await api("/api/admin/maintenances");
    mt = maintenances.find(x => String(x.id) === String(id)) || mt;
  }
  const toLocal = ts => {
    if (!ts) return "";
    const d = new Date(ts * 1000);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  $("#form").innerHTML = `<div class="card"><h2>${id ? tt("maintEdit") : tt("maintAdd")}${tt("maintTitle").replace("🛠️ ", "")}</h2>
    <label>${tt("maintThTitle")} *</label><input id="mt-title" value="${esc(mt.title)}" placeholder="${tt("maintNamePh")}">
    <label>${tt("maintThTitle") === "标题" ? "说明" : "Description"}</label><textarea id="mt-desc" rows="2" placeholder="${tt("maintDescPh")}">${esc(mt.description)}</textarea>
    <div class="row"><div><label>${tt("maintStart")}</label><input id="mt-start" type="datetime-local" value="${toLocal(mt.start_at)}"></div>
    <div><label>${tt("maintEnd")}</label><input id="mt-end" type="datetime-local" value="${toLocal(mt.end_at)}"></div></div>
    <label>${tt("maintThStatus")}</label><select id="mt-status">
      <option value="scheduled"${mt.status === "scheduled" ? " selected" : ""}>${tt("stScheduled")}</option>
      <option value="ongoing"${mt.status === "ongoing" ? " selected" : ""}>${tt("stOngoing")}</option>
      <option value="completed"${mt.status === "completed" ? " selected" : ""}>${tt("stCompleted")}</option>
      <option value="cancelled"${mt.status === "cancelled" ? " selected" : ""}>${tt("stCancelled")}</option>
    </select>
    <div style="margin-top:16px;display:flex;gap:10px"><button class="btn" onclick="saveMaintenance(event, ${id})">${tt("save")}</button>

async function saveMaintenance(event, id) {
  const btn = event.target;
  const oldText = btn.textContent;
  btn.textContent = lang === "zh" ? "保存中…" : "Saving…";
  btn.disabled = true;
  try {
  const toTs = v => Math.floor(new Date(v).getTime() / 1000);
  const b = {
    title: $("#mt-title").value.trim(), description: $("#mt-desc").value.trim(),
    start_at: toTs($("#mt-start").value), end_at: toTs($("#mt-end").value),
    status: $("#mt-status").value
  };
  if (!b.title || !b.start_at || !b.end_at) { alert(tt("maintTitleReq")); return; }
  if (b.end_at <= b.start_at) { alert(tt("maintTimeErr")); return; }
    id ? await api(`/api/admin/maintenances/${id}`, { method: "PUT", body: JSON.stringify(b) })
       : await api("/api/admin/maintenances", { method: "POST", body: JSON.stringify(b) });
    showMaintenances();
  } catch (e) { alert(tt("saveFail") + e.message); }
  finally { btn.textContent = oldText; btn.disabled = false; }
}

async function delMaintenance(id) {

    <label>${tt("fsWebhook")}</label><input id="s-fs" value="${esc(settings.feishu_webhook || "")}" placeholder="${tt("fsWebhookPh")}">
    <label style="margin-top:16px;font-weight:600;color:var(--text)">${tt("expTitle")}</label>
    <label>${tt("expDays")}</label><input id="s-expd" type="number" min="1" max="90" value="${esc(settings.expire_alert_days || "7")}" placeholder="7">
    <label style="margin-top:16px;font-weight:600;color:var(--text)">🔐 ${tt("changePw")}</label>
    <div class="row"><div><label>${tt("oldPw")}</label><input id="s-oldpw" type="password"></div>
    <div><label>${tt("newPw")}</label><input id="s-newpw" type="password" placeholder="${tt("newPwTip")}"></div></div>
    <div class="row"><div><label>${tt("confirmPw")}</label><input id="s-confirmpw" type="password"></div>
    <div style="display:flex;align-items:flex-end"><button class="btn" onclick="changePassword()">${tt("changePwBtn")}</button></div></div>
    <label style="margin-top:16px;font-weight:600;color:var(--text)">🔐 ${tt("totpTitle")}</label>
    <div id="totp-section"><div style="color:var(--muted);font-size:13px">${tt("loading")}</div></div>
    <div style="margin-top:18px;display:flex;gap:10px"><button class="btn" onclick="saveSettings(event)">${tt("save")}</button>
    <button class="btn ghost" onclick="$('#form').innerHTML=''">${tt("cancel")}</button></div>
    <p style="color:var(--muted);font-size:12px;margin-top:12px">💡 ${tt("tokenKeyNote")}</p>
  </div>`;
  $("#form").scrollIntoView({ behavior: "smooth" });
  loadTotpSection();
}

// TOTP 设置区域
async function loadTotpSection() {
  const el = $("#totp-section");
  if (!el) return;
  try {
    const { enabled } = await api("/api/admin/totp/status");
    if (enabled) {
      el.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="color:var(--green)">✅ ${tt("totpEnabled")}</span>
        <button class="btn ghost sm" onclick="disableTotp()">${tt("totpDisable")}</button>
      </div>`;
    } else {
      el.innerHTML = `<div style="color:var(--muted);font-size:13px;margin-bottom:8px">${tt("totpDesc")}</div>
        <button class="btn ghost sm" onclick="setupTotp()">${tt("totpSetup")}</button>
        <div id="totp-qr" style="margin-top:12px"></div>`;
    }
  } catch (e) { el.innerHTML = `<span style="color:var(--red)">${e.message}</span>`; }
}
async function setupTotp() {
  try {
    const { secret, otpauth } = await api("/api/admin/totp/setup", { method: "POST" });
    // 用二维码 API 生成二维码
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(otpauth)}`;
    $("#totp-qr").innerHTML = `<div style="margin-top:8px">
      <img src="${qrUrl}" style="border:8px solid #fff;border-radius:8px" alt="QR" onerror="this.style.display='none';document.getElementById('totp-manual').style.display='block'">
      <div id="totp-manual" style="display:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;font-size:12px;color:var(--muted)">⚠️ 二维码加载失败，请在验证器 App 中手动添加：<br>密钥：<code style="user-select:all;color:var(--text)">${secret}</code></div>
      <div style="font-size:12px;color:var(--muted);margin:8px 0">${tt("totpManual")}<code style="user-select:all">${secret}</code></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="totp-code" placeholder="${tt("totpPh")}" maxlength="6" inputmode="numeric" style="width:140px;text-align:center">
        <button class="btn sm" onclick="enableTotp()">${tt("totpEnable")}</button>
      </div></div>`;
  } catch (e) { alert(e.message); }
}
async function enableTotp() {
  const code = $("#totp-code")?.value?.trim();
  if (!code) return alert(tt("totpPh"));
  try {
    await api("/api/admin/totp/enable", { method: "POST", body: JSON.stringify({ code }) });
    alert(tt("totpEnabled"));
    loadTotpSection();
  } catch (e) { alert(e.message); }
}
async function disableTotp() {
  const pw = prompt(tt("totpDisablePw"));
  if (!pw) return;
  try {
    await api("/api/admin/totp/disable", { method: "POST", body: JSON.stringify({ password: pw }) });
    alert(tt("totpDisabled"));
    loadTotpSection();
  } catch (e) { alert(e.message); }
}

async function changePassword() {
  const oldPw = $("#s-oldpw").value, newPw = $("#s-newpw").value, cfmPw = $("#s-confirmpw").value;
  if (!oldPw || !newPw || !cfmPw) return alert(tt("fillAll"));
  if (newPw.length < 10) return alert(tt("pwTooShort"));
  if (newPw !== cfmPw) return alert(tt("pwMismatch"));
  try {
    const r = await api("/api/admin/change-password", { method: "POST", body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }) });
    localStorage.setItem("probe_admin", r.token);
    adminToken = r.token; // 同步更新内存 token，否则后续请求全 401
    $("#s-oldpw").value = $("#s-newpw").value = $("#s-confirmpw").value = "";
    alert(tt("pwChanged"));
  } catch (e) { alert(e.message); }
}

async function saveSettings(event) {
  const btn = event.target;
  const oldText = btn.textContent;
  btn.textContent = lang === "zh" ? "保存中…" : "Saving…";
  btn.disabled = true;
  try {
  const b = {
    site_title: $("#s-title").value.trim(), site_subtitle: $("#s-subtitle").value.trim(),
    admin_path: (() => { let p = $("#s-adminpath").value.trim() || "/admin"; if (!p.startsWith("/")) p = "/" + p; if (p === "/") { alert(tt("adminPathInvalid")); throw new Error("invalid"); } return p; })(),
    telegram_bot_token: $("#s-tg").value.trim(), telegram_chat_id: $("#s-tgc").value.trim(),
    resend_api_key: $("#s-re").value.trim(), alert_email_from: $("#s-from").value.trim(),
    alert_email_to: $("#s-to").value.trim(),
    dingtalk_webhook: $("#s-ding").value.trim(), bark_url: $("#s-bark").value.trim(),
    wecom_webhook: $("#s-wecom").value.trim(),
    custom_email_url: $("#s-cemurl").value.trim(), custom_email_headers: $("#s-cemh").value.trim(),
    custom_email_from: $("#s-cemfrom").value.trim(), custom_email_to: $("#s-cemto").value.trim(),
    smtp_host: $("#s-smtph").value.trim(), smtp_port: $("#s-smtpp").value.trim(),
    smtp_user: $("#s-smtpu").value.trim(), smtp_from: $("#s-smtpf").value.trim(), smtp_to: $("#s-smtpt").value.trim(),
    smtp_secure: $("#s-smtps").value,
    serverchan_sendkey: $("#s-sc").value.trim(), wxpusher_spt: $("#s-wxp").value.trim(),
    feishu_webhook: $("#s-fs").value.trim(), expire_alert_days: $("#s-expd").value.trim()
  };
  const _smtppw = $("#s-smtppw").value.trim();
  if (_smtppw) b.smtp_pass = _smtppw;
  await api("/api/admin/settings", { method: "PUT", body: JSON.stringify(b) });
  alert(tt("saveOk"));
  // 保存后重新加载表单显示已保存的值，而非清空
  showSettings();
  } catch (e) { alert(tt("saveFail") + e.message); }
  finally { btn.textContent = oldText; btn.disabled = false; }
}

async function testSslCert() {
  const domains = $("#f-ssldom").value.trim();
  if (!domains) { alert(lang === "zh" ? "请先填写要检查的域名" : "Please enter domains first"); return; }
  // 从已保存的监控数据里读证书状态（需 Agent 上报过）
  const m = window._editingMonitor;
  if (m && m.id && m.ssl_days >= 0) {
    const msg = lang === "zh"
      ? `🔒 证书状态\n域名：${m.ssl_domain}\n剩余：${m.ssl_days} 天\n\n${m.ssl_days < 7 ? "⚠️ 7天内到期，会触发告警" : "✅ 正常，不会告警"}`
      : `🔒 Cert status\nDomain: ${m.ssl_domain}\nRemaining: ${m.ssl_days} days\n\n${m.ssl_days < 7 ? "⚠️ Expiring soon, will alert" : "✅ OK"}`;
    alert(msg);
  } else {
    alert(lang === "zh"
      ? `已填写：${domains}\n\nAgent 下次上报（1-2分钟）后，这里会显示证书剩余天数。\n保存后等 2 分钟再点测试，就能看到实际数据。`
      : `Domains: ${domains}\n\nCert info will appear after Agent reports (1-2 min).\nSave and wait 2 minutes, then test again.`);
  }
}
async function testAlert(channel, btn) {
  const oldText = btn.textContent;
  btn.textContent = lang === "zh" ? "保存并发送中…" : "Saving & sending…";
  btn.disabled = true;
  try {
    // 先静默保存当前表单配置，再测试（避免测的是旧配置）
    const b = {
      site_title: $("#s-title").value.trim(), site_subtitle: $("#s-subtitle").value.trim(),
      telegram_bot_token: $("#s-tg").value.trim(), telegram_chat_id: $("#s-tgc").value.trim(),
      resend_api_key: $("#s-re").value.trim(), alert_email_from: $("#s-from").value.trim(),
      alert_email_to: $("#s-to").value.trim(),
      dingtalk_webhook: $("#s-ding").value.trim(), bark_url: $("#s-bark").value.trim(),
      wecom_webhook: $("#s-wecom").value.trim(),
      custom_email_url: $("#s-cemurl").value.trim(), custom_email_headers: $("#s-cemh").value.trim(),
      custom_email_from: $("#s-cemfrom").value.trim(), custom_email_to: $("#s-cemto").value.trim(),
      smtp_host: $("#s-smtph").value.trim(), smtp_port: $("#s-smtpp").value.trim(),
      smtp_user: $("#s-smtpu").value.trim(), smtp_from: $("#s-smtpf").value.trim(), smtp_to: $("#s-smtpt").value.trim(),
      smtp_secure: $("#s-smtps").value,
      serverchan_sendkey: $("#s-sc").value.trim(), wxpusher_spt: $("#s-wxp").value.trim(),
      feishu_webhook: $("#s-fs").value.trim(), expire_alert_days: $("#s-expd").value.trim()
    };
    const _smtppw = $("#s-smtppw").value.trim();
    if (_smtppw) b.smtp_pass = _smtppw;
    await api("/api/admin/settings", { method: "PUT", body: JSON.stringify(b) });
    const r = await api("/api/admin/test-alert", { method: "POST", body: JSON.stringify({ channel }) });
    if (r.error) throw new Error(r.error);
    alert(lang === "zh" ? "✅ 配置已保存，测试消息已发送，请检查是否收到" : "✅ Settings saved, test message sent, please check");
  } catch (e) {
    alert((lang === "zh" ? "❌ 发送失败：" : "❌ Failed: ") + e.message);
  } finally {
    btn.textContent = oldText;
    btn.disabled = false;
  }
}

async function doSubscribe() {
  const email = $("#sub-email").value.trim();
  const msg = $("#sub-msg");
  if (!email) { msg.textContent = tt("enterEmail"); msg.style.color = "var(--red)"; return; }
  msg.textContent = tt("sending"); msg.style.color = "var(--muted)";
  try {
    const r = await api("/api/subscribe", { method: "POST", body: JSON.stringify({ email }) });
    msg.textContent = "✅ " + (r.code === "already" ? tt("subscribed") : tt("subscribeOk")); msg.style.color = "var(--green)";
    $("#sub-email").value = "";
  } catch (e) { msg.textContent = "❌ " + e.message; msg.style.color = "var(--red)"; }
}

// 加载品牌信息
async function loadBranding() {
  try {
    const { title, subtitle } = await api("/api/branding");
    if (title) {
      document.title = "🐻 " + title;
      document.querySelector(".logo span").textContent = title;
    } else {
      document.title = "🐻 " + tt("status");
      document.querySelector(".logo span").textContent = tt("status");
    }
    if (subtitle) $("#subtitle").dataset.brand = subtitle;
  } catch (e) {
    document.querySelector(".logo span").textContent = tt("status");
  }
  $("#lang-btn").textContent = lang === "zh" ? "EN" : "中文";
  $("#admin-link-txt").textContent = tt("admin");
  // 订阅区
  const subTitle = document.querySelector("footer div div div");
  if (subTitle) subTitle.textContent = "📬 " + tt("subscribe");
  const subInput = $("#sub-email");
  if (subInput) subInput.placeholder = tt("subscribePh");
  const subBtn = document.querySelector("footer button");
  if (subBtn) subBtn.textContent = tt("subscribeBtn");
}

// loadStatus 聚合接口已含品牌信息，无需单独调 loadBranding
loadStatus();
// 自动刷新：只在状态页时刷新，进了后台就停；标签页不可见时暂停，切回来立即刷一次
setInterval(() => { if (currentView === "status" && !document.hidden) loadStatus(); }, 60000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && currentView === "status") loadStatus();
});
</script>
